name: Appliance Site to Site VPN
spec_endpoint: /networks/{networkId}/appliance/vpn/siteToSiteVpn
rest_endpoint: /networks/%v/appliance/vpn/siteToSiteVpn
put_create: true
no_delete: true
doc_category: Appliances
test_variables: [test_org, test_network]
ignore_attributes: [nat.legacy]
attributes:
  - tf_name: network_id
    type: String
    id: true
    reference: true
    description: Network ID
    example: L_123456
    test_value: meraki_network.test.id
  - model_name: confirmed
    type: Bool
    description: 'Whether to accept the confirmation warnings for these changes. Defaults to true, which accepts confirmation warnings and preserves the existing update behavior. Set to false to opt in to confirmation warnings. Review the warnings returned in confirmations, then retry with confirmed: true to accept them. Fatal errors must be corrected before retrying.'
    example: "false"
  - model_name: mode
    type: String
    mandatory: true
    description: The site-to-site VPN mode. Can be one of `none`, `spoke` or `hub`
    example: hub
    enum_values: [hub, none, spoke]
    minimum_test_value: '"none"'
  - model_name: mode
    type: String
    data_path: [natTraversal]
    description: Whether NAT traversal is automatic or manually configured.
    example: manual
    enum_values: [automatic, manual]
  - model_name: publicIp
    type: String
    data_path: [natTraversal]
    description: The public IP address used for manual NAT traversal.
    example: 203.0.113.8
  - model_name: publicPort
    type: Int64
    data_path: [natTraversal]
    description: The public port used for manual NAT traversal. Must be between 1024 and 65535.
    example: "4500"
  - model_name: enabled
    type: Bool
    data_path: [sgt]
    description: Whether or not Peer SGT is enabled for traffic to this VPN peer.
    example: "true"
  - model_name: isAllowed
    type: Bool
    data_path: [subnet, nat]
    description: If enabled, VPN subnet translation can be used to translate any local subnets that are allowed to use the VPN into a new subnet with the same number of addresses.
    example: "false"
  - model_name: hostTranslations
    type: List
    description: The list of VPN host translations. Host translations are supported starting from MX firmware version 26.1.2
    attributes:
      - model_name: name
        type: String
        description: The name of the translated host.
        example: Host 1
      - model_name: address
        type: String
        data_path: [local]
        description: The local IP address of the translated host.
        example: 192.168.1.10
      - model_name: address
        type: String
        data_path: [remote]
        description: The remote IP address of the translated host.
        example: 72.168.2.10
  - model_name: hubs
    type: List
    exclude_test: true
    description: The list of VPN hubs, in order of preference. In spoke mode, at least 1 hub is required.
    attributes:
      - model_name: hubId
        type: String
        id: true
        mandatory: true
        description: The network ID of the hub.
        example: N_4901849
      - model_name: useDefaultRoute
        type: Bool
        description: Only valid in `spoke` mode. Indicates whether default route traffic should be sent to this hub.
        example: "true"
  - model_name: subnets
    type: List
    description: The list of subnets and their VPN presence.
    attributes:
      - model_name: localSubnet
        type: String
        id: true
        mandatory: true
        description: The CIDR notation subnet used within the VPN
        example: 192.168.128.0/24
      - model_name: useVpn
        type: Bool
        description: Indicates the presence of the subnet in the VPN
        example: "true"
      - model_name: enabled
        type: Bool
        data_path: [nat]
        exclude_test: true
        description: Whether or not VPN subnet translation is enabled for the subnet
        example: "true"
      - model_name: remoteSubnet
        type: String
        data_path: [nat]
        exclude_test: true
        description: The translated subnet to be used in the VPN
        example: 192.168.2.0/24
test_prerequisites: |
  data "meraki_organization" "test" {
    name = var.test_org
  }
  resource "meraki_network" "test" {
    organization_id = data.meraki_organization.test.id
    name            = var.test_network
    product_types   = ["switch", "wireless", "appliance"]
  }
