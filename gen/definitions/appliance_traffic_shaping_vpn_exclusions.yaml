# Customize Create(), Read() to support org level endpoint
name: Appliance Traffic Shaping VPN Exclusions
spec_endpoint: /networks/{networkId}/appliance/trafficShaping/vpnExclusions
rest_endpoint: /networks/%v/appliance/trafficShaping/vpnExclusions
no_data_source: false
put_create: true
get_from_all: true
no_delete: true
no_import: false
no_read: false
doc_category: Appliances
test_variables: [test_org, test_network, test_network_2, test_appliance_1_serial]
attributes:
  - tf_name: network_id
    type: String
    id: true
    reference: true
    description: Network ID
    example: L_123456
    test_value: meraki_appliance_site_to_site_vpn.test_spoke.network_id
  - model_name: applications
    type: List
    early_access: true
    description: NBAR Application based VPN exclusion rules. Available for networks on >=19.2 firmware
    destroy_value: '[]interface{}{}'
    attributes:
      - model_name: id
        type: String
        mandatory: true
        early_access: true
        description: Application`s Meraki ID.
        example: meraki:layer7/application/2
      - model_name: name
        type: String
        mandatory: true
        early_access: true
        description: Application`s name.
        example: File Transfer Protocol
      - model_name: protocol
        type: String
        early_access: true
        description: Protocol.
        example: tcp
        enum_values: [any, dns, icmp, tcp, udp]
      - model_name: cidr
        type: String
        data_path: [source]
        early_access: true
        description: IP address of the source in CIDR format
        example: 192.168.1.0/24
      - model_name: port
        type: String
        data_path: [source]
        early_access: true
        description: Port for the source
        example: "8000"
      - model_name: vlanId
        type: String
        data_path: [source]
        early_access: true
        exclude_test: true
        description: Vlan Id for the source of the rule
        example: "20"
  - model_name: custom
    type: List
    description: Custom VPN exclusion rules. Pass an empty array to clear existing rules.
    ordered_list: true
    minimum_test_value: dummy value
    destroy_value: '[]interface{}{}'
    attributes:
      - model_name: destination
        type: String
        description: Destination address; hostname required for DNS, IPv4 otherwise.
        example: 192.168.3.0/24
        minimum_test_value: '"192.168.3.0/24"'
      - model_name: port
        type: String
        description: Destination port.
        example: "8000"
      - model_name: protocol
        type: String
        mandatory: true
        description: Protocol.
        example: tcp
        enum_values: [any, dns, icmp, tcp, udp]
      - model_name: cidr
        type: String
        data_path: [source]
        early_access: true
        description: IP address of the source in CIDR format
        example: 192.168.1.0/24
      - model_name: port
        type: String
        data_path: [source]
        early_access: true
        description: Port for the source
        example: "8000"
      - model_name: vlanId
        type: String
        data_path: [source]
        early_access: true
        exclude_test: true
        description: Vlan Id for the source of the rule
        example: "20"
  - model_name: majorApplications
    type: List
    description: Major Application based VPN exclusion rules. Pass an empty array to clear existing rules.
    destroy_value: '[]interface{}{}'
    attributes:
      - model_name: id
        type: String
        id: true
        mandatory: true
        description: Application`s Meraki ID.
        example: meraki:vpnExclusions/application/2
      - model_name: name
        type: String
        description: Application`s name.
        example: Office 365 Sharepoint
        enum_values: [AWS, Box, Office 365 Sharepoint, Office 365 Suite, Oracle, SAP, Salesforce, Skype & Teams, Slack, Webex, Webex Calling, Webex Meetings, Zoom]
      - model_name: protocol
        type: String
        early_access: true
        description: Protocol.
        example: tcp
        enum_values: [any, dns, icmp, tcp, udp]
      - model_name: cidr
        type: String
        data_path: [source]
        early_access: true
        exclude_test: true
        description: IP address of the source in CIDR format
        example: 192.168.20.0/24
      - model_name: port
        type: String
        data_path: [source]
        early_access: true
        exclude_test: true
        description: Port for the source
        example: "8000"
      - model_name: vlanId
        type: String
        data_path: [source]
        early_access: true
        description: Vlan Id for the source of the rule
        example: "20"
test_prerequisites: |
  data "meraki_organization" "test" {
    name = var.test_org
  }
  resource "meraki_network" "test" {
    organization_id = data.meraki_organization.test.id
    name            = var.test_network
    product_types   = ["switch", "wireless", "appliance"]
  }
  resource "meraki_network_device_claim" "test" {
    network_id = meraki_network.test.id
    serials    = [var.test_appliance_1_serial]
  }
  resource "meraki_network" "test_spoke" {
    organization_id = data.meraki_organization.test.id
    name            = var.test_network_2
    product_types   = ["switch", "wireless", "appliance", "sensor", "camera"]
  }
  resource "meraki_appliance_site_to_site_vpn" "test" {
    network_id = meraki_network.test.id
    mode       = "hub"
    subnets    = [
      {
        local_subnet = "192.168.10.0/24"
        use_vpn      = true
      }
    ]
    depends_on = [
      meraki_appliance_vlan.test,
    ]
  }
  resource "meraki_appliance_vlans_settings" "test" {
    network_id = meraki_network.test.id
    vlans_enabled = true
  }
  resource "meraki_appliance_vlan" "test" {
    network_id   = meraki_network.test.id
    name         = "test vlan 10"
    vlan_id      = 10
    appliance_ip = "192.168.10.1"
    subnet       = "192.168.10.0/24"
    depends_on   = [
      meraki_network_device_claim.test,
      meraki_appliance_vlans_settings.test,
    ]
  }
  resource "meraki_appliance_vlans_settings" "test_spoke" {
    network_id = meraki_network.test_spoke.id
    vlans_enabled = true
  }
  resource "meraki_appliance_vlan" "test_spoke" {
    network_id   = meraki_network.test_spoke.id
    name         = "test vlan 20"
    vlan_id      = 20
    appliance_ip = "192.168.20.1"
    subnet       = "192.168.20.0/24"
    depends_on   = [
      meraki_appliance_vlans_settings.test_spoke,
    ]
  }
  resource "meraki_appliance_site_to_site_vpn" "test_spoke" {
    network_id = meraki_network.test_spoke.id
    mode       = "spoke"
    hubs       = [
      {
        hub_id            = meraki_network.test.id
        use_default_route = true
      }
    ]
    subnets = [
      {
        local_subnet  = "192.168.20.0/24"
        use_vpn       = true
      }
    ]
    depends_on = [
      meraki_appliance_site_to_site_vpn.test,
      meraki_appliance_vlan.test_spoke,
    ]
  }
