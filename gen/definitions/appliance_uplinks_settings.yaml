name: Appliance Uplinks Settings
spec_endpoint: /devices/{serial}/appliance/uplinks/settings
rest_endpoint: /devices/%v/appliance/uplinks/settings
put_create: true
no_delete: true
doc_category: Appliances
test_variables: [test_org, test_network, test_appliance_1_serial]
attributes:
  - tf_name: serial
    type: String
    id: true
    reference: true
    description: Device serial
    example: 1234-ABCD-1234
    test_value: tolist(meraki_network_device_claim.test.serials)[0]
  - model_name: enabled
    type: Bool
    data_path: [interfaces, wan1]
    description: Enable or disable the interface.
    example: "true"
  - model_name: enabled
    type: Bool
    data_path: [interfaces, wan1, pppoe]
    description: Whether PPPoE is enabled.
    example: "true"
  - model_name: enabled
    type: Bool
    data_path: [interfaces, wan1, pppoe, authentication]
    description: Whether PPPoE authentication is enabled.
    example: "true"
  - model_name: password
    type: String
    data_path: [interfaces, wan1, pppoe, authentication]
    write_only: true
    sensitive: true
    description: Password for PPPoE authentication. This parameter is not returned.
    example: password
  - model_name: username
    type: String
    data_path: [interfaces, wan1, pppoe, authentication]
    description: Username for PPPoE authentication.
    example: username
  - model_name: address
    type: String
    data_path: [interfaces, wan1, svis, ipv4]
    description: IP address and subnet mask when in static mode.
    example: 9.10.11.10
  - model_name: assignmentMode
    type: String
    data_path: [interfaces, wan1, svis, ipv4]
    description: The assignment mode for this SVI. Applies only when PPPoE is disabled.
    example: static
    enum_values: [dynamic, static]
  - model_name: gateway
    type: String
    data_path: [interfaces, wan1, svis, ipv4]
    exclude_test: true
    description: Gateway IP address when in static mode.
    example: 13.14.15.16
  - model_name: addresses
    type: List
    element_type: String
    data_path: [interfaces, wan1, svis, ipv4, nameservers]
    exclude_test: true
    description: Up to 2 nameserver addresses to use, ordered in priority from highest to lowest priority.
    example: 1.2.3.4
  - model_name: address
    type: String
    data_path: [interfaces, wan1, svis, ipv6]
    description: Static address that will override the one(s) received by SLAAC.
    example: 2001:2:3::4
  - model_name: assignmentMode
    type: String
    data_path: [interfaces, wan1, svis, ipv6]
    description: The assignment mode for this SVI. Applies only when PPPoE is disabled.
    example: static
    enum_values: [dynamic, static]
  - model_name: gateway
    type: String
    data_path: [interfaces, wan1, svis, ipv6]
    exclude_test: true
    description: Static gateway that will override the one received by autoconf.
    example: 2001:2:3::5
  - model_name: addresses
    type: List
    element_type: String
    data_path: [interfaces, wan1, svis, ipv6, nameservers]
    exclude_test: true
    description: Up to 2 nameserver addresses to use, ordered in priority from highest to lowest priority.
    example: 1001:4860:4860::8888
  - model_name: enabled
    type: Bool
    data_path: [interfaces, wan1, transition]
    description: Whether the IPoE transition IPv4 to IPv6 is enabled.
    example: "true"
  - model_name: mode
    type: String
    data_path: [interfaces, wan1, transition]
    description: Mode selector for the IPoE transition IPv4 to IPv6 is enabled.
    example: MAP-E
    enum_values: [DS-Lite, IP-in-IP, MAP-E, MAP-T]
  - model_name: enabled
    type: Bool
    data_path: [interfaces, wan1, transition, authentication]
    description: Whether IPoE transition authentication is enabled.
    example: "true"
  - model_name: password
    type: String
    data_path: [interfaces, wan1, transition, authentication]
    description: Password for IPoE transition authentication. This parameter is not returned.
    example: password
  - model_name: username
    type: String
    data_path: [interfaces, wan1, transition, authentication]
    description: Username for IPoE transition authentication.
    example: 4o6ddns
  - model_name: address
    type: String
    data_path: [interfaces, wan1, transition, ipv4, local]
    description: Static IPv4 information used for host origination and NAT44 translation
  - model_name: interfaceId
    type: String
    data_path: [interfaces, wan1, transition, ipv6]
    description: The 64-bit interface ID (suffix) of the uplink IPv6 address
  - model_name: address
    type: String
    data_path: [interfaces, wan1, transition, ipv6, borderRelay]
    description: CIDR for the border relay for the IPoE transition authentication.
  - model_name: mode
    type: String
    data_path: [interfaces, wan1, transition, ipv6, borderRelay]
    description: Mode selection for the border relay for the IPoE transition.
    example: auto
  - model_name: name
    type: String
    data_path: [interfaces, wan1, transition, isp]
    description: ISP name for the IPoE transition.
    example: OCN IPoE
  - model_name: enabled
    type: Bool
    data_path: [interfaces, wan1, transition, map, draft]
    description: Whether MAP-E draft mode is enabled. This field is accepted only for MAP-E. Null is treated as omitted and preserves the existing setting.
    example: "false"
  - model_name: source
    type: String
    data_path: [interfaces, wan1, transition, map, rules]
    description: How MAP rules are obtained. HTTPS requires an ISP supported for the transition mode.
    example: manual
    enum_values: [DHCPv6, HTTPS, manual]
  - model_name: entries
    type: List
    data_path: [interfaces, wan1, transition, map, rules]
    description: Manual MAP rules. At most one entry is supported.
    attributes:
      - model_name: eaBitLength
        type: Int64
        mandatory: true
        description: Embedded address bit length (0-48).
        example: "20"
        min_int: 0
        max_int: 48
      - model_name: psIdOffset
        type: Int64
        mandatory: true
        description: PSID offset (0-15).
        example: "6"
        min_int: 0
        max_int: 15
      - model_name: address
        type: String
        data_path: [borderRelay]
        description: IPv6 border relay address for MAP-E.
        example: 2001:db8:ffff::1
      - model_name: prefix
        type: String
        data_path: [borderRelay]
        description: IPv6 border relay prefix for MAP-T in CIDR notation, with a prefix length from 0 to 96.
      - model_name: address
        type: String
        data_path: [ipv4, prefix]
        description: IPv4 network address used by the MAP rule, without the prefix length.
        example: 192.0.2.0
      - model_name: length
        type: Int64
        data_path: [ipv4, prefix]
        description: IPv4 prefix length (0-32).
        example: "18"
        min_int: 0
        max_int: 32
      - model_name: address
        type: String
        data_path: [ipv6, prefix]
        description: IPv6 network address used by the MAP rule, without the prefix length.
        example: '2001:db8:100::'
      - model_name: length
        type: Int64
        data_path: [ipv6, prefix]
        description: IPv6 prefix length (0-128).
        example: "36"
        min_int: 0
        max_int: 128
  - model_name: enabled
    type: Bool
    data_path: [interfaces, wan1, vlanTagging]
    description: Whether VLAN tagging is enabled.
    example: "true"
  - model_name: vlanId
    type: Int64
    data_path: [interfaces, wan1, vlanTagging]
    description: The ID of the VLAN to use for VLAN tagging.
    example: "1"
  - model_name: enabled
    type: Bool
    data_path: [interfaces, wan2]
    description: Enable or disable the interface.
    example: "true"
    minimum_test_value: "false"
  - model_name: enabled
    type: Bool
    data_path: [interfaces, wan2, pppoe]
    description: Whether PPPoE is enabled.
    example: "true"
  - model_name: enabled
    type: Bool
    data_path: [interfaces, wan2, pppoe, authentication]
    description: Whether PPPoE authentication is enabled.
    example: "true"
  - model_name: password
    type: String
    data_path: [interfaces, wan2, pppoe, authentication]
    write_only: true
    sensitive: true
    description: Password for PPPoE authentication. This parameter is not returned.
    example: password
  - model_name: username
    type: String
    data_path: [interfaces, wan2, pppoe, authentication]
    description: Username for PPPoE authentication.
    example: username
  - model_name: address
    type: String
    data_path: [interfaces, wan2, svis, ipv4]
    description: IP address and subnet mask when in static mode.
    example: 9.10.11.10
  - model_name: assignmentMode
    type: String
    data_path: [interfaces, wan2, svis, ipv4]
    description: The assignment mode for this SVI. Applies only when PPPoE is disabled.
    example: static
    enum_values: [dynamic, static]
  - model_name: gateway
    type: String
    data_path: [interfaces, wan2, svis, ipv4]
    exclude_test: true
    description: Gateway IP address when in static mode.
    example: 13.14.15.16
  - model_name: addresses
