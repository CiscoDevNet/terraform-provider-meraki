name: Wireless SSIDs
bulk_name: Wireless SSIDs
spec_endpoint: /networks/{networkId}/wireless/ssids
rest_endpoint: /networks/%v/wireless/ssids
no_data_source: true
no_resource: true
bulk_data_source: true
no_update: true
no_delete: true
data_source_name_query: true
doc_category: Wireless
test_variables: [test_org, test_network]
attributes:
  - tf_name: network_id
    type: String
    id: true
    reference: true
    description: Network ID
    example: L_123456
    test_value: meraki_network.test.id
  - model_name: adaptivePolicyGroupId
    type: String
    description: Adaptive policy group ID this SSID is assigned to.
    example: "1234"
  - model_name: adminSplashUrl
    type: String
    description: URL for the admin splash page
    example: http://example.com
  - model_name: adultContentFilteringEnabled
    type: Bool
    description: Boolean indicating whether or not adult content will be blocked. Only present when ipAssignmentMode is `NAT mode`.
    example: "false"
  - model_name: authMode
    type: String
    description: The association control method for the SSID
    example: 8021x-radius
    enum_values: [8021x-entra, 8021x-google, 8021x-localradius, 8021x-meraki, 8021x-nac, 8021x-radius, ipsk-with-nac, ipsk-with-radius, ipsk-without-radius, open, open-enhanced, open-with-nac, open-with-radius, psk]
  - model_name: availableOnAllAps
    type: Bool
    description: Whether all APs broadcast the SSID or if it`s restricted to APs matching any availability tags
    example: "false"
  - model_name: bandSelection
    type: String
    description: The client-serving radio frequencies of this SSID in the default indoor RF profile
    example: 5 GHz band only
    enum_values: [5 GHz band only, Dual band operation, Dual band operation with Band Steering]
  - model_name: defaultVlanId
    type: Int64
    description: The default VLAN ID used for `all other APs`. Only present when the ipAssignmentMode is `Bridge mode` or `Layer 3 roaming` and VLAN tagging is enabled.
    example: "1"
  - model_name: enabled
    type: Bool
    description: Whether or not the SSID is enabled
    example: "true"
  - model_name: encryptionMode
    type: String
    description: The psk encryption mode for the SSID
    example: wpa
    enum_values: [wep, wpa]
  - model_name: enterpriseAdminAccess
    type: String
    description: Whether or not an SSID is accessible by `enterprise` administrators. Only present when the organization supports enterprise admins.
    example: access enabled
    enum_values: [access disabled, access enabled]
  - model_name: ipAssignmentMode
    type: String
    description: The client IP assignment mode
    example: NAT mode
    enum_values: [Bridge mode, Ethernet over GRE, Layer 3 roaming, Layer 3 roaming with a concentrator, NAT mode, VPN]
  - model_name: lanIsolationEnabled
    type: Bool
    description: Boolean indicating whether Layer 2 LAN isolation should be enabled or disabled. Only configurable when ipAssignmentMode is `Bridge mode`.
    example: "true"
  - model_name: localAuth
    type: Bool
    description: Extended local auth flag for Enterprise NAC
    example: "false"
  - model_name: mandatoryDhcpEnabled
    type: Bool
    description: Whether clients connecting to this SSID must use the IP address assigned by the DHCP server
    example: "false"
  - model_name: minBitrate
    type: Float64
    description: The minimum bitrate in Mbps of this SSID in the default indoor RF profile
    example: "11"
  - model_name: name
    type: String
    description: The name of the SSID
    example: My SSID
  - model_name: number
    type: Int64
    description: Unique identifier of the SSID
    example: "0"
  - model_name: perClientBandwidthLimitDown
    type: Int64
    description: The download bandwidth limit in Kbps. (0 represents no limit.)
    example: "0"
  - model_name: perClientBandwidthLimitUp
    type: Int64
    description: The upload bandwidth limit in Kbps. (0 represents no limit.)
    example: "0"
  - model_name: perSsidBandwidthLimitDown
    type: Int64
    description: The total download bandwidth limit in Kbps (0 represents no limit)
    example: "0"
  - model_name: perSsidBandwidthLimitUp
    type: Int64
    description: The total upload bandwidth limit in Kbps (0 represents no limit)
    example: "0"
  - model_name: psk
    type: String
    description: The passkey for the SSID. This param is only valid if the authMode is `psk`. Read-only admins receive a masked value. Only present when authMode is `psk`.
    example: deadbeef
  - model_name: radiusAccountingEnabled
    type: Bool
    description: Whether or not RADIUS accounting is enabled
    example: "false"
  - model_name: radiusAttributeForGroupPolicies
    type: String
    description: RADIUS attribute used to look up group policies
    example: Filter-Id
    enum_values: [Airespace-ACL-Name, Aruba-User-Role, Filter-Id, Reply-Message]
  - model_name: radiusAuthenticationNasId
    type: String
    description: The configured NAS identifier used for RADIUS authentication. May include custom text and template variables. Only present when configured and the SSID uses RADIUS-based authentication.
    example: 00-11-22-33-44-55:AP1
  - model_name: radiusCalledStationId
    type: String
    description: The template of the called station identifier to be used for RADIUS (ex. $NODE_MAC$:$VAP_NUM$). Only present when configured and the SSID uses RADIUS-based auth.
    example: 00-11-22-33-44-55:AP1
  - model_name: radiusCoaEnabled
    type: Bool
    description: If true, Meraki devices will act as a RADIUS Dynamic Authorization Server and will respond to RADIUS Change-of-Authorization and Disconnect messages sent by the RADIUS server. Only present when the SSID uses RADIUS-based auth.
    example: "true"
  - model_name: radiusEnabled
    type: Bool
    description: Whether RADIUS authentication is enabled
    example: "true"
  - model_name: radiusFailoverPolicy
    type: String
    description: Policy which determines how authentication requests should be handled in the event that all of the configured RADIUS servers are unreachable
    example: Deny access
    enum_values: [Allow access, Deny access]
  - model_name: radiusFallbackEnabled
    type: Bool
    description: Whether or not higher priority RADIUS servers should be retried after 60 seconds. Only present when the SSID uses RADIUS-based auth.
    example: "true"
  - model_name: radiusLoadBalancingPolicy
    type: String
    description: Policy which determines which RADIUS server will be contacted first in an authentication attempt, and the ordering of any necessary retry attempts
    example: Round robin
    enum_values: [Round robin, Strict priority order]
  - model_name: radiusOverride
    type: Bool
    description: If true, the RADIUS response can override VLAN tag. This is not valid when ipAssignmentMode is `NAT mode`. Only present when the SSID uses RADIUS-based auth and the network supports group policies.
    example: "false"
  - model_name: radiusProxyEnabled
    type: Bool
    description: If true, Meraki devices will proxy RADIUS messages through the Meraki cloud to the configured RADIUS auth and accounting servers. Only present when the SSID uses RADIUS-based auth.
    example: "false"
  - model_name: radiusServerAttemptsLimit
    type: Int64
    description: The maximum number of transmit attempts after which a RADIUS server is failed over (must be between 1-5). Only present when the SSID uses RADIUS-based auth.
    example: "5"
  - model_name: radiusServerTimeout
    type: Int64
    description: The amount of time for which a RADIUS client waits for a reply from the RADIUS server (must be between 1-10 seconds). Only present when the SSID uses RADIUS-based auth.
    example: "5"
  - model_name: radiusTestingEnabled
    type: Bool
    description: If true, Meraki devices will periodically send Access-Request messages to configured RADIUS servers using identity `meraki_8021x_test` to ensure that the RADIUS servers are reachable. Only present when the SSID is configured to use RADIUS.
    example: "true"
  - model_name: splashPage
    type: String
    description: The type of splash page for the SSID
    example: Click-through splash page
    enum_values: [Billing, Cisco ISE, Click-through splash page, Facebook Wi-Fi, Google Apps domain, Google OAuth, Microsoft Entra ID, None, Password-protected with Active Directory, Password-protected with LDAP, Password-protected with Meraki RADIUS, Password-protected with custom RADIUS, SMS authentication, Sponsored guest, Systems Manager Sentry]
  - model_name: splashTimeout
    type: String
    description: Splash page timeout
    example: 30 minutes
  - model_name: ssidAdminAccessible
    type: Bool
    description: SSID Administrator access status
    example: "false"
  - model_name: useVlanTagging
    type: Bool
    description: Whether or not traffic should be directed to use specific VLANs. Only present when the ipAssignmentMode is `Bridge mode` or `Layer 3 roaming`.
    example: "false"
  - model_name: visible
    type: Bool
    description: Whether the SSID is advertised or hidden by the AP
    example: "true"
  - model_name: walledGardenEnabled
    type: Bool
    description: Allow users to access a configurable list of IP ranges prior to sign-on
    example: "true"
  - model_name: wifiPersonalNetworkEnabled
    type: Bool
    description: Boolean indicating whether or not Wi-Fi Personal Network is enabled for this SSID. Only present when the network supports Wi-Fi Personal Network.
    example: "false"
  - model_name: wlanIdentifier
    type: Int64
    description: WLAN identifier for the SSID. Only present for Meraki admin users.
    example: "16"
  - model_name: wpaEncryptionMode
    type: String
    description: The types of WPA encryption
    example: WPA2 only
    enum_values: [WPA1 and WPA2, WPA1 only, WPA2 only, WPA3 192-bit Security, WPA3 Transition Mode, WPA3 only]
  - model_name: id
    type: String
    data_path: [campusGateway, cluster]
    description: The campus gateway cluster ID used when the ipAssignmentMode is `Campus Gateway`.
    example: "10"
  - model_name: enabled
    type: Bool
    data_path: [dnsRewrite]
    description: Boolean indicating whether or not DNS server rewrite is enabled. If disabled, upstream DNS will be used.
    example: "true"
  - model_name: dnsCustomNameservers
    type: List
    element_type: String
    data_path: [dnsRewrite]
    description: User specified DNS servers (up to two servers)
    example: 8.8.8.8
  - model_name: enabled
    type: Bool
    data_path: [dot11k]
    description: Whether 802.11k is enabled or not.
    example: "true"
  - model_name: adaptive
    type: Bool
    data_path: [dot11r]
    description: Whether 802.11r is adaptive or not.
    example: "true"
  - model_name: enabled
    type: Bool
    data_path: [dot11r]
    description: Whether 802.11r is enabled or not.
    example: "true"
  - model_name: enabled
    type: Bool
    data_path: [dot11w]
    description: Whether 802.11w is enabled or not.
    example: "true"
  - model_name: required
    type: Bool
    data_path: [dot11w]
    description: Whether 802.11w is required or not.
    example: "false"
  - model_name: clientIsolation
    type: Bool
    data_path: [gre]
    description: Whether or not client isolation is enabled.
    example: "false"
  - model_name: key
    type: Int64
    data_path: [gre]
    description: Optional numerical identifier that will add the GRE key field to the GRE header. Used to identify an individual traffic flow within a tunnel.
    example: "5"
  - model_name: host
    type: String
    data_path: [gre, concentrator]
    description: The EoGRE concentrator`s IP or FQDN.
    example: 192.168.1.1
  - model_name: cacheTimeout
    type: Int64
    data_path: [localAuthFallback]
    description: The duration (in seconds) for which auths are cached.
    example: "6500"
  - model_name: enabled
    type: Bool
    data_path: [localAuthFallback]
    description: If true, MR devices will cache authentication credentials for EAP-TLS or for MAC based authentication.
    example: "true"
  - model_name: contents
    type: String
    data_path: [localAuthFallback, serverCaCertificate]
