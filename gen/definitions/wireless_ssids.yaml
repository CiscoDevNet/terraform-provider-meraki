  - model_name: enabled
    type: Bool
    data_path: [namedVlans, radius, guestVlan]
    description: Whether or not RADIUS guest named VLAN is enabled.
    example: "true"
  - model_name: name
    type: String
    data_path: [namedVlans, radius, guestVlan]
    description: RADIUS guest VLAN name.
    example: Guest VLAN
  - model_name: defaultVlanName
    type: String
    data_path: [namedVlans, tagging]
    description: The default VLAN name used to tag traffic in the absence of a matching AP tag.
    example: My VLAN
  - model_name: enabled
    type: Bool
    data_path: [namedVlans, tagging]
    description: Whether or not traffic should be directed to use specific VLAN names.
    example: "true"
  - model_name: byApTags
    type: List
    data_path: [namedVlans, tagging]
    description: The list of AP tags and VLAN names used for named VLAN tagging.
    attributes:
      - model_name: vlanName
        type: String
        description: VLAN name that will be used to tag traffic.
        example: My VLAN
      - model_name: tags
        type: List
        element_type: String
        description: List of AP tags.
        example: tag1
  - model_name: allowedDomains
    type: List
    element_type: String
    data_path: [oauth]
    description: The list of domains allowed access to the network.
    example: example.com
  - model_name: akms
    type: List
    element_type: String
    data_path: [security, encryption]
    description: Authentication key management systems used by the SSID.
    example: SAE
  - model_name: ciphers
    type: List
    element_type: String
    data_path: [security, encryption]
    description: Encryption ciphers used by the SSID.
    example: CCMP 128
  - model_name: enabled
    type: Bool
    data_path: [speedBurst]
    description: Boolean indicating whether or not to allow users to temporarily exceed the bandwidth limit for short periods while still keeping them under the bandwidth limit over time.
    example: "true"
  - model_name: clientsBlockedFromUsingLan
    type: Bool
    data_path: [accessControl]
    description: Whether clients are blocked from using the LAN
    example: "false"
  - model_name: wiredClientsPartOfWifiNetwork
    type: Bool
    data_path: [accessControl]
    description: Whether wired SSID clients are part of the Wi-Fi network
    example: "false"
  - model_name: limit
    type: String
    data_path: [accessControl, bandwidth]
    description: Defined SSID bandwidth limits
    example: unlimited
  - model_name: mode
    type: String
    data_path: [accessControl, clientIpAssignment]
    description: Client IP assignment mode
    example: NAT mode
    enum_values: [Bridge mode, Campus Gateway, Ethernet over GRE, Layer 3 roaming, Layer 3 roaming with a concentrator, NAT mode, Stateless L2TPv3, VPN]
  - model_name: mode
    type: String
    data_path: [accessControl, encryption]
    description: Specifies the authentication and encryption type for the SSID
    example: Open
    enum_values: [802.1X with Access Manager, 802.1X with Google, 802.1X with Local Auth, 802.1X with Meraki RADIUS, 802.1X with custom RADIUS, Enterprise WPA3 192-bit security, Identity PSK with Access Manager, Identity PSK with RADIUS, Identity PSK without RADIUS, Open, Open with Access Manager, Open with RADIUS, Opportunistic Wireless Encryption, PSK (WPA1 and WPA2), PSK (WPA1), PSK (WPA2), PSK (WPA3-SAE Transition Mode), PSK (WPA3-SAE), WEP]
  - model_name: enabled
    type: Bool
    data_path: [accessControl, splashPage]
    description: Whether the splash page is enabled
    example: "false"
  - model_name: theme
    type: String
    data_path: [accessControl, splashPage]
    description: Name of the splash theme, or `n/a` if not applicable
    example: n/a
  - model_name: enabled
    type: Bool
    data_path: [accessControl, tunnel]
    description: Whether tunneling is enabled
    example: "false"
  - model_name: summary
    type: String
    data_path: [accessControl, tunnel]
    description: Summary describing whether traffic is tunneled and to where
    example: Disabled
  - model_name: enabled
    type: Bool
    data_path: [accessControl, vlan]
    description: Whether VLAN tagging is enabled
    example: "false"
  - model_name: tag
    type: String
    data_path: [accessControl, vlan]
    description: VLAN tag applied to this SSID when tagging is enabled
    example: n/a
  - model_name: availabilityTags
    type: List
    element_type: String
    description: List of tags for this SSID. If availableOnAllAps is false, then the SSID is only broadcast by APs with tags matching any of the tags in this list
    example: tag1
  - model_name: radiusAccountingServers
    type: List
    description: List of RADIUS accounting 802.1X servers to be used for authentication
    attributes:
      - model_name: caCertificate
        type: String
        description: Certificate used for authorization for the RADSEC Server
        example: |-
          -----BEGIN CERTIFICATE-----
          MIIEKjCCAxKgAwIBAgIRANb+lsED3eb4+6YKLFFYqEkwDQYJKoZIhvcNAQELBQAw
          gYcxCzAJBgNVBAYTAlVTMRMwEQYDVQQIDApDYWxpZm9ybmlhMREwDwYDVQQHDAhT
