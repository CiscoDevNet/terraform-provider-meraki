# Customize Read() and Create() functions to handle org level GET request
# Customize test configs, the API requires both wan1 and wan2 in `uplinks`
name: Appliance Uplinks NAT
spec_endpoint: /networks/{networkId}/appliance/uplinks/nat
rest_endpoint: /networks/%v/appliance/uplinks/nat
no_data_source: true
put_create: true
no_delete: true
no_import: false
no_read: false
res_description: This resource allows configuring the NAT exceptions of the appliance uplinks of a network. The API requires an entry in `uplinks` for each WAN uplink of the network, for example both `wan1` and `wan2`.
doc_category: Appliances
test_tags: [APPLIANCE_UPLINKS_NAT]
test_variables: [test_org, test_network]
attributes:
  - tf_name: network_id
    type: String
    id: true
    reference: true
    description: Network ID
    example: L_123456
    test_value: meraki_network.test.id
  - model_name: uplinks
    type: List
    mandatory: true
    description: Per-uplink NAT exception configuration on the network.
    attributes:
      - model_name: interface
        type: String
        mandatory: true
        description: Interface name of the uplink
        example: wan1
      - model_name: enabled
        type: Bool
        data_path: [nat]
        mandatory: true
        description: Whether NAT is enabled on the uplink
        example: "false"
test_prerequisites: |
  data "meraki_organization" "test" {
    name = var.test_org
  }
  resource "meraki_network" "test" {
    organization_id = data.meraki_organization.test.id
    name            = var.test_network
    product_types   = ["appliance"]
  }
