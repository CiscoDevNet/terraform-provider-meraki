name: Appliance Static Route
spec_endpoint: /networks/{networkId}/appliance/staticRoutes/{staticRouteId}
rest_endpoint: /networks/%v/appliance/staticRoutes
bulk_data_source: true
data_source_name_query: true
doc_category: Appliances
test_variables: [test_org, test_vrf_network, test_appliance_1_serial]
attributes:
  - tf_name: network_id
    type: String
    reference: true
    description: Network ID
    example: L_123456
    test_value: meraki_appliance_vlan.test.network_id
  - model_name: enabled
    type: Bool
    description: Enable/disable the static route
    example: "true"
  - model_name: gatewayIp
    type: String
    mandatory: true
    description: Gateway IP address (next hop)
    example: 192.168.1.1
  - model_name: gatewayVlanId
    type: Int64
    description: Gateway VLAN ID
    example: "100"
    min_int: 0
    max_int: 4094
    test_value: tonumber(meraki_appliance_vlan.test.vlan_id)
  - model_name: name
    type: String
    mandatory: true
    description: Name of the route
    example: My route
  - model_name: subnet
    type: String
    mandatory: true
    description: Subnet of the route
    example: 5.5.5.0/24
  - model_name: id
    type: String
    data_path: [vrf]
    description: VRF ID for the static route. Use '0' for the default VRF.
    example: "12345"
    test_value: meraki_routing_vrf.test.id
test_prerequisites: |
  data "meraki_organization" "test" {
    name = var.test_org
  }
  data "meraki_network" "test" {
    organization_id = data.meraki_organization.test.id
    name            = var.test_vrf_network
  }
  resource "meraki_network_device_claim" "test" {
    network_id = data.meraki_network.test.id
    serials    = [var.test_appliance_1_serial]
  }
  resource "meraki_appliance_vlans_settings" "test" {
    network_id = data.meraki_network.test.id
    vlans_enabled = true
  }
  resource "meraki_organization_early_access_features_opt_in" "test_vrf" {
    organization_id = data.meraki_organization.test.id
    short_name      = "has_mx_vrf_26_1_early_access"
  }
  resource "meraki_appliance_routing_vrfs_settings" "test" {
    organization_id = data.meraki_organization.test.id
    enabled         = true
    depends_on      = [
      meraki_network_device_claim.test,
    ]
  }
  resource "meraki_routing_vrf" "test" {
    organization_id   = data.meraki_organization.test.id
    name              = "test-vrf"
    appliance_enabled = true
    depends_on        = [
      meraki_organization_early_access_features_opt_in.test_vrf,
      meraki_appliance_routing_vrfs_settings.test,
    ]
  }
  resource "meraki_appliance_vlan" "test" {
    network_id   = meraki_appliance_vlans_settings.test.network_id
    appliance_ip = "192.168.1.2"
    vlan_id      = "100"
    name         = "My VLAN"
    subnet       = "192.168.1.0/24"
    vrf_id       = meraki_routing_vrf.test.id
    depends_on   = [
      meraki_network_device_claim.test,
      meraki_appliance_vlans_settings.test,
    ]
  }
