name: Organization Policies Global Group Policy Firewall Ruleset Assignment
spec_endpoint: /organizations/{organizationId}/policies/global/group/policies/firewall/rulesets/assignments/{assignmentId}
rest_endpoint: /organizations/%v/policies/global/group/policies/firewall/rulesets/assignments
bulk_data_source: true
get_from_all: true
id_name: assignmentId
doc_category: Organizations
test_tags: [ORGANIZATION_POLICIES_GLOBAL]
test_variables: [test_org]
attributes:
  - tf_name: organization_id
    type: String
    reference: true
    description: Organization ID
    example: "123456"
    test_value: data.meraki_organization.test.id
  - model_name: policyId
    type: String
    mandatory: true
    description: ID of the policy to assign the ruleset to
    example: "789"
    test_value: meraki_organization_policies_global_group_policy.test.id
  - model_name: priority
    type: Int64
    description: Priority of the ruleset assignment (lower numbers = higher priority)
    example: "1"
  - model_name: rulesetId
    type: String
    mandatory: true
    description: ID of the ruleset to assign
    example: "456"
    test_value: meraki_organization_policies_global_firewall_ruleset.test.id
test_prerequisites: |
  data "meraki_organization" "test" {
    name = var.test_org
  }
  resource "meraki_organization_policies_global_firewall_ruleset" "test" {
    organization_id = data.meraki_organization.test.id
    name            = "Terraform Test Ruleset"
  }
  resource "meraki_organization_policies_global_group_policy" "test" {
    organization_id = data.meraki_organization.test.id
    name            = "Terraform Test Policy"
  }
